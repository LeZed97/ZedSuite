# macOS build of ZedSuite: universal (Apple Silicon + Intel) .app, the .dmg
# for a first install and the .app.tar.gz the in-app updater downloads.
#
# Run by hand from the Actions tab (or `gh workflow run macos.yml`):
#  - without a tag: builds, checks the bundle, runs the updater test on the
#    runner and keeps the files as a workflow artifact (with screenshots);
#  - with a release tag (vX.Y.Z): same, then attaches the two files to that
#    GitHub release, which must already exist (draft or published).
#
# The app is signed ad hoc only (no Apple developer account): the first
# manual install goes through "Open Anyway" in System Settings; updates
# installed by the app itself are not quarantined, so they open directly.

name: macOS build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the macOS files to (leave empty to only build and test)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the universal app and the disk image
        run: npx tauri build --target universal-apple-darwin

      - name: Package the release files
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist
          cp "$BUNDLE"/dmg/ZedSuite_*.dmg "dist/ZedSuite_${VERSION}_macos-universal.dmg"
          tar -czf "dist/ZedSuite_${VERSION}_macos-universal.app.tar.gz" -C "$BUNDLE/macos" ZedSuite.app
          ls -la dist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the bundle and the disk image
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/ZedSuite.app
          lipo -info "$APP"/Contents/MacOS/*
          codesign --verify --deep --strict --verbose=2 "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|LSMinimumSystemVersion'
          hdiutil attach -nobrowse -readonly "dist/ZedSuite_${VERSION}_macos-universal.dmg" -mountpoint /tmp/zedsuite-dmg
          ls -la /tmp/zedsuite-dmg
          test -d /tmp/zedsuite-dmg/ZedSuite.app
          test -L /tmp/zedsuite-dmg/Applications
          hdiutil detach /tmp/zedsuite-dmg

      - name: Updater test on the runner (old version installed, swapped, relaunched)
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/ZedSuite.app
          ARCHIVE="dist/ZedSuite_${VERSION}_macos-universal.app.tar.gz"
          HOST=$(rustc -vV | sed -n 's/^host: //p')

          # An "older" ZedSuite in Applications: the same bundle stamped 0.0.1
          # and re-signed ad hoc, launched like a user would.
          rm -rf /Applications/ZedSuite.app
          cp -R "$APP" /Applications/ZedSuite.app
          plutil -replace CFBundleShortVersionString -string 0.0.1 /Applications/ZedSuite.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string 0.0.1 /Applications/ZedSuite.app/Contents/Info.plist
          codesign --force --deep --sign - /Applications/ZedSuite.app
          open /Applications/ZedSuite.app
          sleep 12
          OLD_PID=$(pgrep -x ZedSuite | head -1)
          test -n "$OLD_PID"
          echo "old app running: pid $OLD_PID"
          screencapture -x dist/screenshot-before-update.png || true

          # Same code as the app's "Update now" (src-tauri/src/update.rs,
          # macos module): swap the bundle, arm the relaunch script, quit.
          cargo build --release --target "$HOST" --manifest-path src-tauri/Cargo.toml --example macos_update_test
          "src-tauri/target/$HOST/release/examples/macos_update_test" "$ARCHIVE" /Applications/ZedSuite.app "$VERSION" "$OLD_PID"
          kill "$OLD_PID"

          # The relaunch script must reopen the new bundle by itself.
          NEW_PID=""
          for i in $(seq 1 30); do
            NEW_PID=$(pgrep -x ZedSuite | head -1 || true)
            if [ -n "$NEW_PID" ] && [ "$NEW_PID" != "$OLD_PID" ]; then break; fi
            sleep 1
          done
          test -n "$NEW_PID"
          test "$NEW_PID" != "$OLD_PID"
          echo "new app running: pid $NEW_PID"
          plutil -p /Applications/ZedSuite.app/Contents/Info.plist | grep CFBundleShortVersionString | grep -F "$VERSION"
          sleep 6
          test ! -e /Applications/.ZedSuite-previous.app
          test ! -e /Applications/.ZedSuite-update
          sleep 8
          screencapture -x dist/screenshot-after-update.png || true
          ls -la ~/Library/Application\ Support/com.zedperf.zedsuite || true
          pkill -x ZedSuite || true
          echo "UPDATER TEST: OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

      - name: Attach the files to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/ZedSuite_*_macos-universal.dmg dist/ZedSuite_*_macos-universal.app.tar.gz --clobber
